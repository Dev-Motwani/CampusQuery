{% extends "base.html" %}

{% block title %}404 - Page Not Found | CampusQueri{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm p-5 rounded-4 bg-white">
                <div class="display-1 fw-bold text-primary mb-3">404</div>
                <h3 class="fw-bold mb-3">Notice or Page Not Found</h3>
                <p class="text-secondary mb-4">
                    The campus notice, document, or page you are looking for might have been archived, removed, or has a changed URL.
                </p>
                <div>
                    <a href="{{ url_for('student.index') }}" class="btn btn-primary px-4 py-2">
                        <i class="bi bi-house-door me-1"></i> Return to CampusQueri Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
